events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ограничение на размер загружаемого файла (500 МБ)
    client_max_body_size 500M;

    server {
        listen 80;
        server_name localhost;

        # 1. Раздача статики (наш сайт)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Проксирование запросов к API
        location /api/ {
            # Убираем префикс /api/ перед отправкой в FastAPI (опционально)
            # proxy_pass http://backend:8000/; 
            
            # Оставляем как есть, если в FastAPI эндпоинты начинаются с /api
            proxy_pass http://backend:8000; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
