version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - frontend_net

  backend:
    image: media-platform-backend
    environment:
      - MINIO_URL=minio:9000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - POSTGRES_URL=postgresql://admin:admin@postgres:5432/mediadb
    deploy:
      replicas: 2
    networks:
      - frontend_net
      - backend_net

  worker:
    image: media-platform-worker
    environment:
      - MINIO_URL=minio:9000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - POSTGRES_URL=postgresql://admin:admin@postgres:5432/mediadb
    deploy:
      replicas: 3
    networks:
      - backend_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    networks:
      - backend_net

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=mediadb
    networks:
      - backend_net

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    networks:
      - backend_net

networks:
  frontend_net:
    driver: overlay
  backend_net:
    driver: overlay
