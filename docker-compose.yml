#version: '3.8'

services:
  # 1. Nginx - Reverse Proxy и раздача статики
  nginx:
    image: nginx:alpine
    container_name: media_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - frontend_net

  # 2. Backend API - FastAPI
  backend:
    build: ./backend
    container_name: media_backend
    environment:
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - POSTGRES_URL=postgresql://admin:admin@postgres:5432/mediadb
    depends_on:
      - postgres
      - rabbitmq
      - minio
    networks:
      - frontend_net
      - backend_net

  # 3. Worker - Обработчик медиа (Pillow + FFmpeg)
  worker:
    build: ./worker
    container_name: media_worker
    environment:
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - POSTGRES_URL=postgresql://admin:admin@postgres:5432/mediadb
    depends_on:
      - postgres
      - rabbitmq
      - minio
    networks:
      - backend_net

  # 4. RabbitMQ - Очередь задач
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: media_rabbitmq
    ports:
      - "15672:15672" # Web-интерфейс для просмотра очередей
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - backend_net

  # 5. PostgreSQL - База данных
  postgres:
    image: postgres:15-alpine
    container_name: media_postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=mediadb
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net

  # 6. MinIO - Хранилище файлов (S3)
  minio:
    image: pgsty/silo:latest
    container_name: media_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web-интерфейс
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio_data:/data
    networks:
      - backend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  pg_data:
